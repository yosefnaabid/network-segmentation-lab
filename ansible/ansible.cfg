# Configuracion de Ansible del lab. El runner es ctrl01; el acceso a los
# invitados llega por la red del lab a partir de la fase 4 (con el firewall
# enrutando). Hasta entonces los playbooks NO se ejecutan, solo se lintan.

[defaults]
inventory = inventory/lab.yml
roles_path = roles
interpreter_python = auto_silent
forks = 5
timeout = 20

[ssh_connection]
pipelining = true
