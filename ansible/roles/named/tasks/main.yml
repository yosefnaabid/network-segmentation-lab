---
# AlmaLinux: paquete "bind", servicio "named", config en /etc/named.conf,
# zonas en /var/named/ (ADR 0005: aqui no hay bind9 de Debian).
- name: Instalar BIND y utilidades
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Configuracion principal de named
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    validate: /usr/sbin/named-checkconf %s
  notify: Reiniciar named

- name: Zona directa de {{ lab_domain }}
  ansible.builtin.template:
    src: db.lab.interno.j2
    dest: "/var/named/db.{{ lab_domain }}"
    owner: root
    group: named
    mode: "0640"
  notify: Reiniciar named

- name: Zona inversa de SERVERS
  ansible.builtin.template:
    src: db.reverse.j2
    dest: "/var/named/db.{{ named_reverse_zone }}"
    owner: root
    group: named
    mode: "0640"
  notify: Reiniciar named

- name: Servicio named activo
  ansible.builtin.service:
    name: named
    state: started
    enabled: true

- name: Abrir DNS en firewalld (segunda capa, ADR 0006)
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled
