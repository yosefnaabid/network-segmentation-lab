---
- name: Reiniciar qemu-guest-agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: restarted

- name: Reiniciar chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Recargar NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    state: reloaded

- name: Reiniciar sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
