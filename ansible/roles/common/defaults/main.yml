---
# Paquetes base de todos los AlmaLinux del lab.
common_packages:
  - chrony
  - firewalld
  - policycoreutils-python-utils
  - qemu-guest-agent
  - audit

# Allow-list del agente QEMU: la de fabrica de RHEL MAS guest-exec y
# guest-exec-status, que el harness necesita (incidencia #9). Declarada
# tambien aqui para que el estado de la imagen y el de Ansible converjan.
common_qga_allow_rpcs: >-
  guest-sync-delimited,guest-sync,guest-ping,guest-get-time,guest-set-time,
  guest-info,guest-shutdown,guest-fsfreeze-status,guest-fsfreeze-freeze,
  guest-fsfreeze-freeze-list,guest-fsfreeze-thaw,guest-fstrim,
  guest-suspend-disk,guest-suspend-ram,guest-suspend-hybrid,
  guest-network-get-interfaces,guest-get-vcpus,guest-set-vcpus,
  guest-get-disks,guest-get-fsinfo,guest-set-user-password,
  guest-get-memory-blocks,guest-set-memory-blocks,guest-get-memory-block-info,
  guest-get-host-name,guest-get-users,guest-get-timezone,guest-get-osinfo,
  guest-get-devices,guest-ssh-get-authorized-keys,guest-ssh-add-authorized-keys,
  guest-ssh-remove-authorized-keys,guest-get-diskstats,guest-get-cpustats,
  guest-network-get-route,guest-get-load,guest-exec,guest-exec-status
