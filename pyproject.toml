# Configuracion compartida de las herramientas de Python del repo.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["flowmatrix", "report", "sanitize", "validate_flows"]

[tool.pytest.ini_options]
markers = [
    "lab: tests que requieren el laboratorio levantado (se excluyen en CI)",
]
addopts = "-ra"
